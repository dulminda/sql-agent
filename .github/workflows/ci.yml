name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p ${{ matrix.python }} .venv && uv pip install -p .venv -e '.[dev]'
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/pytest

  guardrail-gate:
    # Re-runs the attack corpus and schema-linking eval on every PR. A guard change that lets a
    # single attack through, or blocks a single legitimate query, fails the build.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.12 .venv && uv pip install -p .venv -e .
      - run: make gate
      - run: cat reports/security.md reports/linking.md >> "$GITHUB_STEP_SUMMARY"

  agent-eval:
    # Live end-to-end benchmark. Runs only when an ANTHROPIC_API_KEY secret is configured and the
    # change touches agent behaviour. About $1-2 per run on the 40-question Chinook set.
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.12 .venv && uv pip install -p .venv -e .
      - name: Benchmark
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          make bench
          cat reports/agent_chinook.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          name: agent-report
          path: reports/agent_chinook.*
